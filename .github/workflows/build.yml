name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: WestCosmetics
          path: build/libs/*.jar
      - name: Wydanie (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: najnowsza
          name: WestCosmetics - najnowsza wersja
          body: "Pobierz plik WestCosmetics-*.jar (bez -sources) i wrzuć do folderu mods (Fabric 1.21.4 + Fabric API)."
          files: build/libs/WestCosmetics-*.jar
          make_latest: true

  installer:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build instalatora
        run: dotnet build installer/WestMCInstaller.csproj -c Release -o out
      - name: Nazwa pliku
        shell: bash
        run: cp out/WestMC-Instalator.exe WestMC-Instalator.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: najnowsza
          files: WestMC-Instalator.exe

  launcher:
    runs-on: windows-latest
    needs: build
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node -e "require('./src/auth'); require('./src/java'); require('./src/game'); console.log('moduly OK')"
      - run: npx electron-builder --win nsis --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: najnowsza
          files: launcher/dist/Atomic-Setup.exe

  westpanel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build WestPanel
        working-directory: westpanel
        run: gradle build --no-daemon --stacktrace
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: westpanel
          name: WestPanel - panel administracji
          body: "WestPanel-Velocity na proxy, WestPanel-Paper na gildie/duels/lobby."
          files: |
            westpanel/velocity/build/libs/WestPanel-Velocity-*.jar
            westpanel/paper/build/libs/WestPanel-Paper-*.jar
          make_latest: false
