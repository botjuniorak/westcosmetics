  epicka:
    nazwa: "&#C08BFF&lSkrzynia Epicka"
    nazwa-klucza: "&#C08BFFKlucz do Skrzyni Epickiej"
    nagrody:
      - {przedmiot: "DIAMOND 8", szansa: 14}
      - {przedmiot: "ENCHANTED_GOLDEN_APPLE 1", szansa: 7}
      - {przedmiot: "eventowka:rzucak 3", szansa: 10}
      - {przedmiot: "eventowka:buty 1", szansa: 7}
      - {przedmiot: "eventowka:perla 8", szansa: 8}
      - {ikona: "GOLD_BLOCK", nazwa: "&6+10 000$", komendy: ["eco daj {GRACZ} 10000"], szansa: 10}
      - {ikona: "DIAMOND_CHESTPLATE", nazwa: "&b&lDiamentowy Set (Ochrona III)", przedmioty: ["DIAMOND_HELMET 1 protection:3 unbreaking:2", "DIAMOND_CHESTPLATE 1 protection:3 unbreaking:2", "DIAMOND_LEGGINGS 1 protection:3 unbreaking:2", "DIAMOND_BOOTS 1 protection:3 unbreaking:2"], szansa: 10, ogloszenie: true}
      - {przedmiot: "NETHERITE_SWORD 1 sharpness:3", szansa: 5}
      - {przedmiot: "eventowka:hydro 1", szansa: 6, ogloszenie: true}
      - {przedmiot: "eventowka:sakiewka 1", szansa: 6, ogloszenie: true}
      - {przedmiot: "eventowka:kula 1", szansa: 8}
      - {przedmiot: "eventowka:kostka 1", szansa: 6}
      - {przedmiot: "klucz:legendarna 1", szansa: 3, ogloszenie: true}
  legendarna:
    nazwa: "&#FFC93D&lSkrzynia Legendarna"
    nazwa-klucza: "&#FFC93DKlucz do Skrzyni Legendarnej"
    nagrody:
      - {przedmiot: "eventowka:kilof 1", szansa: 6, ogloszenie: true}
      - {przedmiot: "eventowka:miecz 1", szansa: 6, ogloszenie: true}
      - {przedmiot: "eventowka:totem 1", szansa: 6, ogloszenie: true}
      - {przedmiot: "eventowka:siekiera 1", szansa: 5}
      - {przedmiot: "eventowka:luk 1", szansa: 5}
      - {przedmiot: "NETHERITE_INGOT 2", szansa: 6}
      - {ikona: "NETHER_STAR", nazwa: "&6+50 000$", komendy: ["eco daj {GRACZ} 50000"], szansa: 5, ogloszenie: true}
