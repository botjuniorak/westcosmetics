# ============================================================
#  WestSMP - tryb SMP (wymaga paczki WestMc v0.13+)
# ============================================================
# SZAFA: /szafa
#  Rzecz jest odblokowana, gdy gracz ma uprawnienie westsmp.szafa.<rodzaj>.<id>
#  (np. westsmp.szafa.pet.smoczek) albo westsmp.szafa.wszystko, albo gdy "darmowe: true".
szafa:
  pety:
    piesek:   {nazwa: "&#E8913APiesek", darmowe: true}
    kotek:    {nazwa: "&#9AA0AAKotek", darmowe: true}
    lisek:    {nazwa: "&#F06A22Lisek"}
    smoczek:  {nazwa: "&#7A4DE0Smoczek", lata: true}
    pingwin:  {nazwa: "&#3A8CF0Pingwin"}
    panda:    {nazwa: "&fPanda"}
    duszek:   {nazwa: "&#F2F4FFDuszek", lata: true}
    westus:   {nazwa: "&#6EC3FFMini Westus"}
  kostiumy:
    korona:          {nazwa: "&#FFC93DKorona", miejsce: glowa}
    aureola:         {nazwa: "&#FFF2A0Aureola", miejsce: glowa}
    rogi:            {nazwa: "&#C4142ARogi diabla", miejsce: glowa}
    czarodziej:      {nazwa: "&#7B5CFFKapelusz maga", miejsce: glowa}
    mikolaj:         {nazwa: "&#D92030Czapka Mikolaja", miejsce: glowa}
    skrzydla_aniola: {nazwa: "&fSkrzydla aniola", miejsce: plecy}
    skrzydla_demona: {nazwa: "&#8A1A3ASkrzydla demona", miejsce: plecy}
    plecak:          {nazwa: "&#3A8CF0Plecak WestMC", miejsce: plecy, darmowe: true}
  papugi:
    ara:       {nazwa: "&#E22A2AAra", darmowe: true}
    niebieska: {nazwa: "&#2F7FE8Niebieska papuga"}
    zielona:   {nazwa: "&#45C24AZielona papuga"}
    teczowa:   {nazwa: "&#FF5AB4Teczowa papuga"}
    zlota:     {nazwa: "&#FFC93DZlota Krolewska"}
    piracka:   {nazwa: "&8Piracka papuga"}
  sklep-tekst: "&7Odblokujesz w &#FFC93D/sklep &7lub na &#FFC93Dwestmc.eu"

# EVENTOWKI: /eventowka daj <gracz> <nazwa> [ilosc]  (kilof, siekiera, rzucak, totem, luk, miecz, buty, perla)
# Kilof i siekiera: SHIFT = kopiesz normalnie, jeden blok.
eventowki:
  kilof:    {wlaczona: true}
  siekiera: {wlaczona: true, max-blokow: 150}
  rzucak:   {wlaczona: true, promien: 4.0, sila: 1.4, obrazenia: 0.0}
  totem:    {wlaczona: true}
  luk:      {wlaczona: true, co-ile-ms: 3000, obrazenia: 5.0, prawdziwy-piorun: false}
  miecz:    {wlaczona: true, procent: 0.15, max-leczenie: 3.0}
  buty:     {wlaczona: true, sila: 0.9}
  perla:    {wlaczona: true}

# TELEPORTY: /spawn /end /nether /afk /warp <nazwa> /teleporty (menu)
# Admin: /setwarp <spawn|end|nether|afk|nazwa> [ladna nazwa] - ustawia tam, gdzie stoisz.
teleport:
  odliczanie: 3              # sekundy (ruch = anulowanie); OP i westsmp.teleport.natychmiast - od razu
  nowi-na-spawn: true
  odrodzenie-na-spawnie: true   # po smierci na spawn (chyba ze lozko/kotwica)
warpy:
  spawn:  {nazwa: "&#3AA0FF&lSPAWN"}
  end:    {nazwa: "&#B06AFF&lSPAWN ENDU"}
  nether: {nazwa: "&#FF7A2A&lSPAWN NETHERU"}
  afk:    {nazwa: "&#4EE08F&lSTREFA AFK"}
teleporty-menu:
  spawn:  {slot: 10, ikona: LODESTONE, nazwa: "&#3AA0FF&lSpawn", opis: ["&7Glowny spawn serwera"]}
  end:    {slot: 11, ikona: ENDER_EYE, nazwa: "&#B06AFF&lEnd", opis: ["&7Spawn Endu - event Smok"]}
  nether: {slot: 12, ikona: NETHERRACK, nazwa: "&#FF7A2A&lNether", opis: ["&7Spawn Netheru"]}
  afk:    {slot: 14, ikona: CLOCK, nazwa: "&#4EE08F&lStrefa AFK", opis: ["&7Stoj i zbieraj nagrody"]}
  rtp:    {slot: 15, ikona: GRASS_BLOCK, nazwa: "&#FFC93D&lLosowy teleport", opis: ["&7Nowe miejsce na baze"], akcja: "komenda:rtp"}
  szafa:  {slot: 16, ikona: ARMOR_STAND, nazwa: "&#C08BFF&lSzafa", opis: ["&7Pety, kostiumy, papugi"], akcja: "komenda:szafa"}
# NPC: /npc <typ> (stoisz tam, gdzie ma stac) | /npc usun
npc:
  przewodnik:       {skin: przewodnik, nazwa: "&#3AA0FF&lPRZEWODNIK", podpis: "&7» Teleporty «", akcja: "menu:teleporty"}
  kowal:            {skin: kowal, nazwa: "&#E8913A&lKOWAL", podpis: "&7» Naprawa i ulepszanie «", akcja: "komenda:kowal"}
  handlarz:         {skin: handlarz, nazwa: "&#45C27A&lHANDLARZ", podpis: "&7» Sklep «", akcja: "komenda:sklep"}
  bankier:          {skin: bankier, nazwa: "&#FFC93D&lBANKIER", podpis: "&7» Portfel i czeki «", akcja: "komenda:portfel"}
  straznik_endu:    {skin: straznik_endu, nazwa: "&#B06AFF&lSTRAZNIK ENDU", podpis: "&7» Teleport do Endu «", akcja: "warp:end"}
  straznik_netheru: {skin: straznik_netheru, nazwa: "&#FF7A2A&lSTRAZNIK NETHERU", podpis: "&7» Teleport do Netheru «", akcja: "warp:nether"}
npc-postawione: {}

# PIENIADZE: jesli jest EssentialsX/inna ekonomia przez Vault - uzywamy jej; jesli nie - wlasna WestMC.
kasa:
  symbol: "$"
  start: 500            # ile dostaje nowy gracz (tylko wlasna ekonomia)
czeki:
  min: 100
coinflip:
  min: 100
  max: 10000000
  podatek: 0.05         # 5% puli dla serwera
  ogloszenie-od: 50000  # ogloszenie na czacie od takiej puli
czas:
  punkty-za-minute: 1
  afk-nie-liczy: true
  komenda-sklepu: "sklep czas"

# CZAT: rangi wg uprawnienia westsmp.ranga.<nazwa> (kolejnosc = waznosc)
czat:
  wlaczony: true
  format: "{KLAN}{RANGA}&f{GRACZ} &8» &7"
  rangi:
    wlasciciel: "&#FF5A68&lWLASCICIEL &r"
    admin: "&#FF5A68&lADMIN &r"
    mod: "&#3AA0FF&lMOD &r"
    vip: "&#FFC93D&lVIP &r"
  wejscie: "&8[&a+&8] &7{GRACZ}"
  wyjscie: "&8[&c-&8] &7{GRACZ}"
# BOSSBAR u gory ekranu (zmienia sie co X sekund)
bossbar:
  wlaczony: true
  co-ile-sekund: 10
  teksty:
    - "&#3AA0FF&lWESTMC.EU &8• &fTryb SMP &8• &7Graczy: &a{ONLINE}"
    - "&#FFC93D&lDISCORD &8» &fdiscord.gg/westmceu"
    - "&#C08BFF&lSZAFA &8» &fpety, kostiumy i papugi pod &#C08BFF/szafa"
    - "&#4EE08F&lCOINFLIP &8» &fzagraj o kase pod &#4EE08F/cf"
# AUTOMATYCZNE WIADOMOSCI (| = nowa linia)
wiadomosci:
  co-ile-sekund: 180
  lista:
    - "&8&m                              |&#3AA0FF&l WESTMC &8» &7Dolacz na Discorda: &fdiscord.gg/westmceu|&8&m                              "
    - "&#FFC93D&lPORADA &8» &7Nie masz gdzie mieszkac? Wpisz &f/rtp"
    - "&#4EE08F&lPORADA &8» &7Stoj w strefie AFK (&f/afk&7), a dostaniesz nagrody!"
    - "&#C08BFF&lPORADA &8» &7Czeki wypiszesz u Bankiera lub pod &f/czek"
# USUWANIE ITEMOW Z ZIEMI (eventowki nigdy nie sa usuwane)
czyszczenie:
  wlaczone: true
  co-ile-minut: 10
  nie-usuwaj: [NETHER_STAR, DRAGON_EGG, ELYTRA]
# ANTYLOGOUT: wyjscie w walce = smierc; w walce nie wejdziesz na spawn (czerwone szklo)
# Strefa spawnu: /strefa spawn od  i  /strefa spawn do  (dwa przeciwne rogi)
antylogout:
  sekundy: 30
  zablokowane-komendy: [spawn, home, warp, tpa, tpaccept, rtp, end, nether, afk, teleporty, ec, enderchest]
  strefa-spawnu: {}
# STREFA AFK: /strefa afk od  i  /strefa afk do ; nagroda co X minut stania w strefie
strefa-afk:
  nagroda-co-minut: 10
  komendy: ["eco daj {GRACZ} 250"]
# LOSOWY TELEPORT
rtp:
  swiat: world
  min: 500
  max: 5000
  cooldown-sekund: 60
# KEYALL o konkretnych godzinach (komendy dla kazdego gracza online)
keyall:
  godziny: ["18:00", "21:00"]
  komendy: ["eco daj {GRACZ} 1000"]
  wiadomosc: "&#FFC93D&lKEYALL &8» &7Kazdy gracz online dostal nagrode!"
# KODY: /kod <nazwa>  (np. /kod WAKACJE)
kody:
  start:
    komendy: ["eco daj {GRACZ} 1000"]
    opis: "&7+1000$ na start!"
    limit: 0           # 0 = bez limitu
  wakacje:
    komendy: ["eco daj {GRACZ} 5000"]
    opis: "&7+5000$ na wakacje!"
    wazny-do: "2027-08-31"
    limit: 100
# END: bloki postawione przez graczy znikaja po czasie
end-bloki:
  wlaczone: true
  znikaja-po-minutach: 60
# ENDERCHEST: uprawnienia westsmp.enderchest.4 / .5 / .6 = wiecej rzedow

# SKLEP: /sklep (za $) i /sklep czas (za punkty czasu). przedmiot: "MATERIAL ilosc" | "eventowka:kilof" | "klucz:epicka"
sklep:
  dolary:
    diament:  {przedmiot: "DIAMOND 1", cena: 250, nazwa: "&bDiament"}
    zloto:    {przedmiot: "GOLDEN_APPLE 1", cena: 150, nazwa: "&6Zlote jablko"}
    perla:    {przedmiot: "ENDER_PEARL 4", cena: 200, nazwa: "&3Perly x4"}
    exp:      {przedmiot: "EXPERIENCE_BOTTLE 16", cena: 400, nazwa: "&aButelki EXP x16"}
    klucz:    {przedmiot: "klucz:zwykla 1", cena: 2500, nazwa: "&7Klucz zwykly"}
    rzucak:   {przedmiot: "eventowka:rzucak 1", cena: 5000}
  czas:
    klucz-epicki:  {przedmiot: "klucz:epicka 1", cena: 300}
    buty:          {przedmiot: "eventowka:buty 1", cena: 600}
    klucz-legenda: {przedmiot: "klucz:legendarna 1", cena: 1200}
# SKRZYNIE: /skrzynie ; postaw skrzynie na spawnie: patrz na blok i /skrzynie ustaw <zwykla|epicka|legendarna>
# Klucze: /klucz daj <gracz|*> <typ> [ilosc]   (np. w keyall)
skrzynie:
  zwykla:
    nazwa: "&f&lSkrzynia Zwykla"
    nazwa-klucza: "&fKlucz do Skrzyni Zwyklej"
    nagrody:
      - {przedmiot: "IRON_INGOT 16", szansa: 30}
      - {przedmiot: "GOLD_INGOT 8", szansa: 25}
      - {przedmiot: "DIAMOND 2", szansa: 15}
      - {przedmiot: "EXPERIENCE_BOTTLE 16", szansa: 15}
      - {ikona: "GOLD_NUGGET", nazwa: "&6+1000$", komendy: ["eco daj {GRACZ} 1000"], szansa: 12}
      - {przedmiot: "klucz:epicka 1", szansa: 3, ogloszenie: true}
  epicka:
    nazwa: "&#C08BFF&lSkrzynia Epicka"
    nazwa-klucza: "&#C08BFFKlucz do Skrzyni Epickiej"
    nagrody:
      - {przedmiot: "DIAMOND 8", szansa: 25}
      - {przedmiot: "ENCHANTED_GOLDEN_APPLE 1", szansa: 10}
      - {przedmiot: "eventowka:rzucak 3", szansa: 20}
      - {przedmiot: "eventowka:buty 1", szansa: 12}
      - {przedmiot: "eventowka:perla 8", szansa: 15}
      - {ikona: "GOLD_BLOCK", nazwa: "&6+10 000$", komendy: ["eco daj {GRACZ} 10000"], szansa: 15}
      - {przedmiot: "klucz:legendarna 1", szansa: 3, ogloszenie: true}
  legendarna:
    nazwa: "&#FFC93D&lSkrzynia Legendarna"
    nazwa-klucza: "&#FFC93DKlucz do Skrzyni Legendarnej"
    nagrody:
      - {przedmiot: "eventowka:kilof 1", szansa: 15, ogloszenie: true}
      - {przedmiot: "eventowka:miecz 1", szansa: 15, ogloszenie: true}
      - {przedmiot: "eventowka:totem 1", szansa: 15, ogloszenie: true}
      - {przedmiot: "eventowka:siekiera 1", szansa: 15}
      - {przedmiot: "eventowka:luk 1", szansa: 15}
      - {przedmiot: "NETHERITE_INGOT 2", szansa: 15}
      - {ikona: "NETHER_STAR", nazwa: "&6+50 000$", komendy: ["eco daj {GRACZ} 50000"], szansa: 10, ogloszenie: true}
skrzynie-bloki: {}
# ZESTAWY: /zestawy ; przedmioty z ekwipunku: /zestawy zapisz <nazwa> (zapisuje caly twoj ekwipunek)
zestawy:
  gracz: {slot: 10, nazwa: "&f&lZestaw Gracz", ikona: IRON_CHESTPLATE, co-ile-godzin: 24, opis: ["&7Podstawowe narzedzia i jedzenie"], przedmioty: ["STONE_SWORD 1", "STONE_PICKAXE 1", "BREAD 16"]}
  vip: {slot: 12, nazwa: "&#FFC93D&lZestaw VIP", ikona: GOLDEN_CHESTPLATE, ranga: "VIP", uprawnienie: "westsmp.zestaw.vip", co-ile-godzin: 24, przedmioty: ["IRON_SWORD 1", "IRON_PICKAXE 1", "GOLDEN_APPLE 4"]}
  svip: {slot: 14, nazwa: "&#C08BFF&lZestaw SVIP", ikona: DIAMOND_CHESTPLATE, ranga: "SVIP", uprawnienie: "westsmp.zestaw.svip", co-ile-godzin: 48, przedmioty: ["DIAMOND_SWORD 1", "DIAMOND_PICKAXE 1", "GOLDEN_APPLE 8"]}
  elita: {slot: 16, nazwa: "&#FF5A68&lZestaw Elita", ikona: NETHERITE_CHESTPLATE, ranga: "ELITA", uprawnienie: "westsmp.zestaw.elita", co-ile-godzin: 72, przedmioty: ["DIAMOND_SWORD 1", "ENCHANTED_GOLDEN_APPLE 1", "klucz:epicka 1"]}
# DZIENNE NAGRODY: /nagrody - seria 7 dni (przerwa = od nowa)
dzienne-nagrody:
  dzien-1: {ikona: GOLD_NUGGET, opis: ["&7+500$"], komendy: ["eco daj {GRACZ} 500"]}
  dzien-2: {ikona: GOLD_INGOT, opis: ["&7+1000$"], komendy: ["eco daj {GRACZ} 1000"]}
  dzien-3: {ikona: DIAMOND, opis: ["&7Diamenty x3"], przedmioty: ["DIAMOND 3"]}
  dzien-4: {ikona: TRIPWIRE_HOOK, opis: ["&7Klucz zwykly"], przedmioty: ["klucz:zwykla 1"]}
  dzien-5: {ikona: EXPERIENCE_BOTTLE, opis: ["&7+2500$ i EXP"], komendy: ["eco daj {GRACZ} 2500"], przedmioty: ["EXPERIENCE_BOTTLE 16"]}
  dzien-6: {ikona: TRIPWIRE_HOOK, opis: ["&7Klucz epicki"], przedmioty: ["klucz:epicka 1"]}
  dzien-7: {ikona: NETHER_STAR, opis: ["&7Klucz legendarny + 10 000$"], komendy: ["eco daj {GRACZ} 10000"], przedmioty: ["klucz:legendarna 1"]}
kowal:
  cena-za-punkt: 2
  cena-ulepszenia: 5000
  szansa-ulepszenia: 0.6
wymiana:
  tylko-blisko: false
  odleglosc: 10

# KSIEGI (wlasne zaczarowania): /ksiega daj <gracz> <przetapianie|telekineza|kopacz|noc|lekkosc|odbicie|madrosc|zycie>
# Nakladanie: Magiczne Kowadlo (/kowadlo). W sklepie/skrzyniach: przedmiot "ksiega:telekineza 1"
ksiegi:
  cena: 2500
  poziomy: 10
# KLANY: /klan
klany:
  cena: 10000
  max-czlonkow: 10
  friendly-fire: false
# USTAWKA: /ustawka <gracz> ; admin: /ustawka arena <nazwa> 1  i  /ustawka arena <nazwa> 2
ustawka:
  domyslna-stawka: 1000
  areny: {}

# SCOREBOARD + TAB (grafika HD z paczki WestMC)
hud:
  scoreboard: true
  tab: true
  odswiezanie-tickow: 40
  tlo-liczb: "#140A2E"
  tab-linia: "&7Jestes na &#C08BFF&lSMP &8• &7Graczy online&8: &a&l{ONLINE}"
  tab-podpowiedz: "&7Szafa: &f/szafa &8• &7Klany: &f/klan &8• &7Sklep: &f/sklep"
  tab-format: "{KLAN}{NICK}"
# TOPKI: /topki ; tablice HD: /topki postaw <bogacze|czas|klany|zabojstwa> (stan tam, gdzie ma stac, patrz w strone graczy)
topki:
  odswiezanie-sekund: 300
  skala: 0.8
  wysokosc: 1.0
  zasieg: 48
  odwroc: false
