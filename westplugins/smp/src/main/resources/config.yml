      - {przedmiot: "GOLD_INGOT 8", szansa: 22}
      - {przedmiot: "DIAMOND 2", szansa: 14}
      - {przedmiot: "EXPERIENCE_BOTTLE 16", szansa: 13}
      - {ikona: "GOLD_NUGGET", nazwa: "&6+1000$", komendy: ["eco daj {GRACZ} 1000"], szansa: 12}
      - {przedmiot: "DIAMOND_SWORD 1 sharpness:2", szansa: 5}
      - {ikona: "DIAMOND_CHESTPLATE", nazwa: "&b&lDiamentowy Set", przedmioty: ["DIAMOND_HELMET 1", "DIAMOND_CHESTPLATE 1", "DIAMOND_LEGGINGS 1", "DIAMOND_BOOTS 1"], szansa: 3, ogloszenie: true}
