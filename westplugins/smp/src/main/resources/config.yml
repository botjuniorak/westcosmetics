# USTAWKA: /ustawka <gracz> ; admin: /ustawka arena <nazwa> 1  i  /ustawka arena <nazwa> 2
ustawka:
  domyslna-stawka: 1000
  areny: {}

# SCOREBOARD + TAB (grafika HD z paczki WestMC)
hud:
  scoreboard: true
  # styl: tekst = ikonki + tekst (jak na gildiach) | hd = duzy panel z paczki
  styl: tekst
  tytul: "&#C08BFF&lWEST&f&lMC&#C08BFF&l.EU"
  # max 15 linii; {GRACZ} {RANGA} {KLAN} {KASA} {PUNKTY} {CZAS} {ZABOJSTWA} {SMIERCI} {ONLINE}
  # ikonki: \uE460 gracz, \uE461 ranga, \uE465 klan, \uE467 kasa, \uE469 punkty, \uE466 czas, \uE463 zabojstwa, \uE464 smierci, \uE468 online
  linie:
    - " "
    - "\uE460 &7Gracz: &f{GRACZ}"
    - "\uE461 &7Ranga: {RANGA}"
    - "\uE465 &7Klan: {KLAN}"
    - "  "
    - "\uE467 &7Stan konta: &#FFC23D{KASA}"
    - "\uE469 &7Punkty czasu: &#4EE08F{PUNKTY}"
    - "\uE466 &7Czas gry: &e{CZAS}"
    - "\uE463 &7Zabójstwa: &c{ZABOJSTWA}"
    - "\uE464 &7Śmierci: &7{SMIERCI}"
    - "   "
    - "\uE468 &7Online: &a{ONLINE}"
    - "&8» &#C08BFFwestmc.eu"
  tab: true
  odswiezanie-tickow: 40
  tlo-liczb: "#140A2E"
  tab-linia: "&7Jestes na &#C08BFF&lSMP &8• &7Graczy online&8: &a&l{ONLINE}"
  tab-podpowiedz: "&7Szafa: &f/szafa &8• &7Klany: &f/klan &8• &7Sklep: &f/sklep"
  tab-format: "{KLAN}{NICK}"
# TOPKI: /topki ; tablice HD: /topki postaw <bogacze|czas|klany|zabojstwa> (stan tam, gdzie ma stac, patrz w strone graczy)
topki:
  odswiezanie-sekund: 300
  skala: 0.8
  wysokosc: 1.0
  zasieg: 48
  odwroc: false

# EVENT SMOK [End]: o tych godzinach (i /smok start) w Endzie wylatuje Smok Westusia.
# Ogloszenia 10, 5 i 1 min wczesniej. Ataki: deszcz ognia, sludzy, piorun, fala uderzeniowa.
smok:
  swiat: world_the_end
  godziny: ["20:00"]
  nazwa: "&#C08BFF&lSmok Westusia"
  zycie: 800
  wysokosc: 90
  atak-co-sekund: 12
  limit-minut: 30
  min-obrazen: 20
  nagrody:
    top1: ["kasa:25000", "klucz:legendarna 1", "eventowka:miecz 1"]
    top2: ["kasa:15000", "klucz:epicka 2"]
    top3: ["kasa:10000", "klucz:epicka 1"]
    uczestnik: ["kasa:2500", "klucz:zwykla 1"]
# MINI EVENTY na czacie co X minut (przepisz, matma, rozsypanka, zgadnij liczbe). Admin: /minievent <typ>
# "deszcz" = deszcz nagrod na spawnie (wymaga /setwarp spawn)
mini-eventy:
  wlaczone: true
  co-minut: 20
  min-graczy: 3
  czas-sekund: 60
  nagrody: ["kasa:1000"]
  slowa: [westmc, klany, diament, smok, eventowka, kowadlo, netherite, enderchest, coinflip, szafa]
  deszcz-nagrod-automatycznie: false
  deszcz:
    sekund: 20
    promien: 12
    na-pol-sekundy: 2
    przedmioty: ["DIAMOND 1", "GOLDEN_APPLE 1", "EMERALD 3", "EXPERIENCE_BOTTLE 4", "klucz:zwykla 1"]

# RYNEK GRACZY: /rynek ; wystawianie: /rynek wystaw <cena> (przedmiot z reki)
# wiecej ofert: uprawnienie westsmp.rynek.limit.<liczba> (np. westsmp.rynek.limit.10 dla VIP)
rynek:
  limit-ofert: 5
  wazna-godzin: 48
  podatek-procent: 5
  min-cena: 1
  max-cena: 1000000000
  ogloszenia: true
  zakazane: [BEDROCK, BARRIER, COMMAND_BLOCK]

# SPRZEDAZ (/sell): ceny w pliku ceny.yml (generuje sie sam). Po zmianie: /sell przeladuj
# cena w opisie itemow wymaga pluginu PacketEvents na serwerze
sprzedaz:
  cena-w-opisie: true
