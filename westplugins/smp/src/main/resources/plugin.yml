name: WestSMP
version: '${version}'
main: pl.westmc.smp.WestSMP
api-version: '1.21'
softdepend: [Vault]
loadbefore: [Essentials]
description: Tryb SMP WestMC
commands:
  szafa:
    description: Szafa - pety, kostiumy, papugi
    aliases: [pety, kostiumy, papugi]
  eventowka:
    description: Eventowki - daj / lista
    aliases: [eventowki]
  spawn: {description: Teleport na spawn}
  end: {description: Teleport na spawn Endu}
  nether: {description: Teleport na spawn Netheru}
  afk: {description: Teleport do strefy AFK}
  warp: {description: Warpy}
  setwarp: {description: Ustaw spawn/warp, permission: westsmp.admin}
  delwarp: {description: Usun warp, permission: westsmp.admin}
  teleporty: {description: Menu teleportow, aliases: [warpy, spawny]}
  npc: {description: NPC na spawnie, permission: westsmp.admin}
  money: {description: Saldo, aliases: [bal, balance, kasa]}
  pay: {description: Przelew, aliases: [przelew]}
  eco: {description: Admin ekonomii, permission: westsmp.admin}
  portfel: {description: Bankier, aliases: [bank, bankier]}
  czek: {description: Wypisz czek}
  coinflip: {description: Coinflip, aliases: [cf]}
  czas: {description: Czas gry, aliases: [playtime]}
  vanish: {description: Vanish, aliases: [v], permission: westsmp.vanish}
  adminchat: {description: Czat administracji, aliases: [ac], permission: westsmp.adminchat}
  helpop: {description: Wiadomosc do administracji}
  gm: {description: Tryb gry, permission: westsmp.admin}
  god: {description: Niesmiertelnosc, permission: westsmp.admin}
  fly: {description: Latanie, permission: westsmp.fly}
  heal: {description: Leczenie, permission: westsmp.admin}
  feed: {description: Najedzenie, permission: westsmp.admin}
  rtp: {description: Losowy teleport, aliases: [wild, losowytp]}
  kod: {description: Kody promocyjne, aliases: [kody]}
  keyall: {description: Klucz dla wszystkich, permission: westsmp.admin}
  czyszczenie: {description: Czyszczenie itemow teraz, permission: westsmp.admin}
  strefa: {description: Strefy spawn/afk, permission: westsmp.admin}
  sklep: {description: Sklep za dolary i za czas}
  skrzynie: {description: Skrzynie, aliases: [skrzynia, crate]}
  klucz: {description: Daj klucze, permission: westsmp.admin, aliases: [klucze]}
  zestawy: {description: Zestawy, aliases: [zestaw, kit, kits]}
  nagrody: {description: Dzienne nagrody, aliases: [daily, dzienne]}
  kowal: {description: Kowal - naprawa i ulepszanie, aliases: [napraw, repair]}
  wymiana: {description: Wymiana z graczem, aliases: [trade, handel]}
  kowadlo: {description: Magiczne kowadlo, aliases: [magicznekowadlo]}
  ksiega: {description: Daj ksiege, permission: westsmp.admin, aliases: [ksiegi]}
  klan: {description: Klany, aliases: [klany, clan]}
  ustawka: {description: Ustawka 1v1 o stawke, aliases: [duel, wyzwij]}
  topki: {description: Topki serwera, aliases: [top, ranking]}
  smok: {description: Event Smok w Endzie}
  minievent: {description: Mini eventy (admin), aliases: [mini]}
  rynek: {description: Rynek graczy, aliases: [ah, market]}
permissions:
  westsmp.vanish: {default: op}
  westsmp.adminchat: {default: op}
  westsmp.helpop.widzi: {default: op}
  westsmp.fly: {default: op}
  westsmp.antylogout.omin: {default: false}
  westsmp.admin:
    default: op
  westsmp.teleport.natychmiast:
    default: op
  westsmp.eventowki.admin:
    default: op
  westsmp.szafa.wszystko:
    description: Odblokowane wszystko w szafie
    default: op
